name: Update BrandComposer Calendar

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar script
        run: |
          python3 build-calendar.py update-calendar.candidate.scpt
      - name: Validate before committing
        run: |
          python3 validate-calendar.py update-calendar.candidate.scpt
          mv update-calendar.candidate.scpt update-calendar.scpt
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "BrandComposer Bot"
          git config user.email "calendar@brandcomposer.local"
          git add update-calendar.scpt
          git diff --cached --quiet || (git commit -m "Auto-update calendar" && git push)

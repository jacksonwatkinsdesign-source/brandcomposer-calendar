name: Update BrandComposer Calendar

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate calendar script with Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "CLAUDE_API_KEY secret is empty or unset."
            exit 1
          fi
          RESPONSE=$(curl -sS --fail-with-body https://api.anthropic.com/v1/messages \
            -H "x-api-key: $CLAUDE_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{
              "model": "claude-sonnet-4-5",
              "max_tokens": 20000,
              "messages": [{
                "role": "user",
                "content": "Generate a complete AppleScript that creates STORY slots in the BrandComposer calendar for September 3 2026 through March 31 2027.\n\nNever invent a grid post. Do NOT schedule a [POST] on the assumption that artwork will be finished by some date. The ONLY posts you may schedule are the ones listed under CONFIRMED POSTS below, where the art already exists and is waiting to go up. If that list is empty, emit no [POST] events at all.\n\nCONFIRMED POSTS — finished, unpublished art with a committed date:\n- Odessa II, Friday September 10 2026 (debut carousel, Stranger Things S2 momentum)\n- Olivia II, Friday September 24 2026 (debut carousel, Rodrigo Unraveled Tour launch)\n\nFor each confirmed post, emit exactly three events on that day:\n1. [POST] Name — <reason> at 9:00 AM\n2. [STORY] Name — Carousel slide 1 at 1:00 PM\n3. [STORY] Name — Carousel slide 2 at 7:00 PM\nEvery post is a carousel of at least two images, and every slide runs as its own native story frame on post day, spaced hours apart rather than back to back.\n\nROSTER — every subject already posted to the grid, one entry per PERSON:\nKarlie, Núria, Paula, Kate Bartlett, Erin, Amelie, Lily Collins, Renate, Rebecca, Gracie Abrams, Zendaya, Romy, Elle, Anya, Odessa, Olivia\n\nSome people have been drawn more than once. A roman numeral (Odessa II, Olivia II) identifies WHICH PORTRAIT, not a different person. Rotation is per person: Odessa and Odessa II are one entry in the rotation, not two. In event summaries use the bare first name from the roster above — no numerals, no surnames, no slide labels. A person with three portraits still gets exactly one slot per rotation cycle.\n\nROTATION RULES — these are hard constraints, verify before output:\n1. Every subject on the roster appears across the WHOLE date range. No subject may be absent from the final 60 days.\n2. Each subject gets a slot roughly every 30 days. No subject goes more than 32 days between consecutive slots.\n3. Every subject ends with a slot count within 2 of every other subject.\n\nSLOT MECHANICS:\n- Times are 9:00 AM, 1:00 PM, or 7:00 PM only. Each event is 15 minutes.\n- Never more than 7 slots on a single day.\n- Summary format: [STORY] Name — Rotation baseline\n\nDATES — every weekday name must match its calendar date. September 3 2026 is a THURSDAY. Compute the real weekday for each date; do not carry a weekday forward from the previous line. A wrong weekday name silently shifts the whole schedule.\n\nIDEMPOTENCY — the script is re-run on a schedule, so it must not stack duplicates. Open with a delete of everything already in range before creating anything:\ntell application \"Calendar\"\n\tset bc_cal to calendar \"BrandComposer\"\n\tset rangeStart to date \"Thursday, September 3, 2026 12:00:00 AM\"\n\tset rangeEnd to date \"Thursday, April 1, 2027 12:00:00 AM\"\n\tdelete (every event of bc_cal whose start date is greater than or equal to rangeStart and start date is less than rangeEnd)\nthen create the new events, then end tell.\n\nClose with a notification that states the actual number of events created. Do not hardcode a count.\n\nTENTPOLE HOOKS — real dated external events. Give each its own slot on that date, summary format [STORY] Name — <reason> HOOK:\nRomy Oct 11 (30th birthday), Elle Nov 20 (Hunger Games: Sunrise on the Reaping), Gracie Abrams Dec 2 (tour launch), Zendaya + Anya + Rebecca Dec 18 (Dune: Part Three), Lily Collins Mar 18 (birthday + Emily in Paris), Elle Mar 19 (The Nightingale)\n\nBefore emitting, check rules 1-3 against what you generated and correct any subject that violates them. Output ONLY the AppleScript code."
              }]
            }')
          ERR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERR" ]; then
            echo "API error: $ERR"
            exit 1
          fi
          SCRIPT=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')
          if [ -z "$SCRIPT" ] || [ "$SCRIPT" = "null" ]; then
            echo "API returned no script text. Raw response:"
            echo "$RESPONSE" | head -c 2000
            exit 1
          fi
          STOP=$(echo "$RESPONSE" | jq -r '.stop_reason // empty')
          if [ "$STOP" = "max_tokens" ]; then
            echo "Generation hit max_tokens and is truncated. Not committing."
            exit 1
          fi
          printf '%s\n' "$SCRIPT" > update-calendar.candidate.scpt
      - name: Validate before committing
        run: |
          python3 validate-calendar.py update-calendar.candidate.scpt
          mv update-calendar.candidate.scpt update-calendar.scpt
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "BrandComposer Bot"
          git config user.email "calendar@brandcomposer.local"
          git add update-calendar.scpt
          git diff --cached --quiet || (git commit -m "Auto-update calendar" && git push)
